<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F6F4FB">
<meta name="description" content="Notes, handwriting, voice memos and wallet — all on your device.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kalemdar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F6F4FB;--card:#fff;--ink:#2D2A3E;--muted:#8D8AA3;--line:#ECE9F4;--soft:#F1EEF9;
  --pri:#7C6CF0;--pri2:#B9A7FF;--in:#2FB383;--out:#EC6A96;
  --shadow:0 10px 28px -14px rgba(76,60,160,.28);--shadow2:0 2px 10px -4px rgba(76,60,160,.12);
  --n-pink:#FFE4EE;--n-peach:#FFEADB;--n-butter:#FFF4C9;--n-mint:#DDF5EA;--n-sky:#DDEEFB;--n-lav:#ECE7FF;--n-sand:#F3ECE2;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#15141C;--card:#211F2B;--ink:#EEECF7;--muted:#9B98B2;--line:#302E3E;--soft:#2A2836;
  --shadow:0 10px 28px -14px rgba(0,0,0,.7);--shadow2:0 2px 10px -4px rgba(0,0,0,.5);
  --n-pink:#3A2731;--n-peach:#3A2D25;--n-butter:#37331F;--n-mint:#1F3329;--n-sky:#1F2C3A;--n-lav:#2B2640;--n-sand:#332D27;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
body{min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.ic{display:block;flex:none}
.hidden{display:none!important}
#app{max-width:620px;margin:0 auto;min-height:100dvh;position:relative}
#main{padding:calc(env(safe-area-inset-top) + 16px) 18px calc(118px + env(safe-area-inset-bottom))}
body.locked #app{visibility:hidden}

/* ---------- 3D clay tiles ---------- */
.tile{--s:46px;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.34);display:inline-grid;place-items:center;position:relative;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -5px 9px rgba(0,0,0,.14),0 9px 16px -8px var(--c2);overflow:hidden}
.tile::before{content:"";position:absolute;left:10%;top:5%;width:64%;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.tile i{font-style:normal;font-size:calc(var(--s)*.5);line-height:1;position:relative;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22));color:#fff}
.tile i svg{width:calc(var(--s)*.5);height:calc(var(--s)*.5)}
.tile.xs{--s:30px}.tile.sm{--s:38px}.tile.lg{--s:58px}
.ill{display:block;width:100%;height:100%;overflow:visible}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.hello{font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.3px}
.date{color:var(--muted);font-size:13px;margin-top:2px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.bal-pill{display:flex;flex-direction:column;align-items:flex-end;background:var(--card);padding:8px 14px;border-radius:16px;box-shadow:var(--shadow2)}
.bal-pill span{font-size:11px;color:var(--muted)}
.bal-pill b{font-size:15px}
.pos{color:var(--in)}.neg{color:var(--out)}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow2);color:var(--ink)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:13px 16px;color:var(--muted);box-shadow:var(--shadow2);margin-bottom:22px;cursor:text}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.sec-h h2{font-size:18px;font-weight:800}
.link{color:var(--pri);font-weight:700;font-size:14px}

/* ---------- notebooks ---------- */
.books{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 14px;margin:0 -18px 6px;scrollbar-width:none}
.books::-webkit-scrollbar{display:none}
.book{flex:none;width:96px;background:var(--card);border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow2);border:2px solid transparent;transition:transform .15s}
.book:active{transform:scale(.96)}
.book.on{border-color:var(--pri);box-shadow:0 10px 22px -12px var(--pri)}
.book .bi{width:58px;height:58px}
.book span{font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book small{color:var(--muted);font-size:11px}
.book.add .bi{display:grid;place-items:center;border-radius:18px;border:2px dashed var(--line);color:var(--muted)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:700;color:var(--muted);box-shadow:var(--shadow2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* ---------- note cards ---------- */
.notes.grid{columns:2;column-gap:12px}
.notes.list{display:flex;flex-direction:column;gap:10px}
.ncard{break-inside:avoid;margin-bottom:12px;background:var(--nbg,var(--card));border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;position:relative}
.notes.list .ncard{margin:0;display:flex}
.notes.list .ncard .thumb{width:96px;flex:none}
.notes.list .ncard .thumb img{height:100%;max-height:none}
.ncard:active{transform:scale(.98)}
.ncard .thumb img{display:block;width:100%;max-height:170px;object-fit:cover;background:var(--soft)}
.ncard .nbody{padding:14px 14px 12px;min-width:0;flex:1}
.ncard h3{font-size:15px;font-weight:800;line-height:1.3;margin-bottom:5px;padding-inline-end:18px;word-break:break-word}
.ncard p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ncard .pin{position:absolute;top:12px;inset-inline-end:10px;color:var(--pri)}
.ncard .meta{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.bdot{width:8px;height:8px;border-radius:50%;background:var(--c,#ccc);display:inline-block}
.ncard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(124,108,240,.12);color:var(--pri)}
.prog{margin:8px 0 2px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted)}
.prog i{flex:1;height:6px;border-radius:9px;background:rgba(0,0,0,.07);overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:linear-gradient(90deg,#9BE7CF,#3FB88F);border-radius:9px}
.nc-pink{--nbg:var(--n-pink)}.nc-peach{--nbg:var(--n-peach)}.nc-butter{--nbg:var(--n-butter)}.nc-mint{--nbg:var(--n-mint)}.nc-sky{--nbg:var(--n-sky)}.nc-lav{--nbg:var(--n-lav)}.nc-sand{--nbg:var(--n-sand)}

.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .ill-wrap{width:130px;height:130px;margin:0 auto 10px;animation:float 4s ease-in-out infinite}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),560px);height:70px;background:var(--card);border-radius:26px;box-shadow:0 18px 40px -16px rgba(60,40,140,.35),0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700}
.tabbar .ti{width:38px;height:32px;border-radius:12px;display:grid;place-items:center;transition:.2s}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ti{color:#fff;background:linear-gradient(150deg,#C6B9FF,#7C6CF0);box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -4px 8px rgba(40,20,120,.3),0 8px 14px -6px #7C6CF0}
.fab-in{width:60px;height:60px;border-radius:22px;color:#fff;display:grid;place-items:center;transform:translateY(-20px);position:relative;overflow:hidden;
  background:linear-gradient(150deg,#FFB3CE,#B49BFF 45%,#7C6CF0);
  box-shadow:inset 0 3px 2px rgba(255,255,255,.55),inset 0 -7px 12px rgba(40,20,120,.35),0 16px 26px -10px rgba(124,108,240,.85),0 0 0 6px var(--bg);transition:transform .2s}
.fab-in::before{content:"";position:absolute;left:12%;top:6%;width:60%;height:38%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.7),transparent)}
.fab-in svg{position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.fab:active .fab-in{transform:translateY(-20px) scale(.92)}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(25,20,45,.35);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet{position:absolute;left:50%;bottom:0;width:min(100%,620px);max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-t{font-size:20px;font-weight:800;margin:2px 2px 6px}
.sh-p{color:var(--muted);margin:0 2px 16px;line-height:1.5}
.sh-sub{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 10px}
.row-btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:18px;font-weight:800;font-size:15px;background:var(--card);box-shadow:var(--shadow2)}
.btn.primary{color:#fff;background:linear-gradient(150deg,#A797FF,#7C6CF0);box-shadow:inset 0 2px 1px rgba(255,255,255,.4),0 10px 20px -10px #7C6CF0}
.btn.danger{color:#fff;background:linear-gradient(150deg,#FF9DBE,#EC6A96)}
.btn.ghost.danger{background:var(--card);color:var(--out)}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--pri2)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 6px}

.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;background:var(--card);border-radius:20px;font-size:12px;font-weight:700;box-shadow:var(--shadow2)}
.qitem:active{transform:scale(.95)}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-radius:18px;font-weight:700;text-align:left;box-shadow:var(--shadow2)}
.tpl small{display:block;font-weight:500;color:var(--muted);font-size:12px}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:14px;border:3px solid transparent;background:var(--bg-sw);box-shadow:var(--shadow2)}
.sw.on{border-color:var(--pri)}
.sw.none{background:var(--card);position:relative}
.sw.none::after{content:"";position:absolute;inset:8px;border-top:2px solid var(--muted);transform:rotate(45deg) translate(-2px,6px)}

.mlist{display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow2)}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:700;text-align:left;border-bottom:1px solid var(--line);width:100%}
.mrow:last-child{border-bottom:0}
.mrow .ic{color:var(--muted)}
.mrow.danger,.mrow.danger .ic{color:var(--out)}
.mrow small{margin-left:auto;color:var(--muted);font-weight:600}

/* ---------- editor ---------- */
.editor{position:fixed;inset:0;height:var(--vvh,100dvh);z-index:40;background:var(--nbg,var(--bg));display:flex;flex-direction:column;transform:translateY(30px);opacity:0;transition:transform .25s,opacity .25s}
.editor.open{transform:none;opacity:1}
.editor.nc-none{--nbg:var(--bg)}
.ed-top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;max-width:760px;width:100%;margin:0 auto}
.ed-top .icon-btn{background:var(--card)}
.ed-book{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:14px;background:var(--card);font-size:13px;font-weight:700;box-shadow:var(--shadow2);max-width:40%;overflow:hidden;white-space:nowrap}
.ed-status{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.icon-btn.on{color:var(--pri)}
.ed-scroll{flex:1;overflow-y:auto;padding:6px 20px 30px;max-width:760px;width:100%;margin:0 auto}
.ed-title{width:100%;border:0;background:none;outline:none;font-size:26px;font-weight:800;padding:8px 0;letter-spacing:-.3px}
.ed-title::placeholder{color:var(--muted);opacity:.6}
.ed-tags{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.ed-tags .tag{display:inline-flex;align-items:center;gap:4px}
.ed-tags .tag.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.ed-body{outline:none;min-height:50vh;font-size:16.5px;line-height:1.65;word-break:break-word;padding-bottom:40vh}
.ed-body:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.ed-body h1{font-size:24px;margin:.6em 0 .2em}.ed-body h2{font-size:20px;margin:.6em 0 .2em}
.ed-body p{margin:.3em 0}
.ed-body blockquote{margin:.6em 0;padding:10px 14px;border-inline-start:4px solid var(--pri2);background:rgba(124,108,240,.08);border-start-end-radius:14px;border-end-end-radius:14px}
.ed-body a{color:var(--pri)}
.ed-body hr{border:0;border-top:2px dashed var(--line);margin:16px 0}
.ed-body ul,.ed-body ol{padding-inline-start:24px;margin:.3em 0}
.ed-body ul.checklist{list-style:none;padding-inline-start:2px}
.ed-body ul.checklist li{position:relative;padding-inline-start:32px;margin:6px 0}
.ed-body ul.checklist li::before{content:"";position:absolute;inset-inline-start:0;top:2px;width:20px;height:20px;border-radius:7px;border:2px solid var(--pri2);background:var(--card);cursor:pointer}
.ed-body ul.checklist li.done{color:var(--muted);text-decoration:line-through}
.ed-body ul.checklist li.done::before{background:linear-gradient(150deg,#9BE7CF,#3FB88F);border-color:#3FB88F;box-shadow:inset 0 2px 1px rgba(255,255,255,.5)}
.ed-body ul.checklist li.done::after{content:"";position:absolute;inset-inline-start:7px;top:5px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ed-body figure.media{margin:12px 0;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--card);cursor:pointer;user-select:none}
.ed-body figure.media img{display:block;width:100%;height:auto;min-height:60px}
.ed-body figure.sketch{background:#FFFDF8}
.ed-body .lcard-wrap{margin:10px 0}
.ed-body a.lcard,.lcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow2);text-decoration:none;color:var(--ink)}
.lcard .lc-t{display:flex;flex-direction:column;min-width:0}
.lcard .lc-t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .lc-t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme=dark] .ed-body span[style*="background-color"]{color:#2D2A3E}
.ed-format{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--line);scrollbar-width:none}
.ed-format::-webkit-scrollbar{display:none}
.ed-format button{flex:none;min-width:40px;height:38px;padding:0 10px;border-radius:12px;font-weight:800;background:var(--soft);display:grid;place-items:center}
.ed-tools{display:flex;justify-content:space-between;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.ed-tools::-webkit-scrollbar{display:none}
.ed-tools button{flex:none;width:42px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.ed-tools button.on{background:var(--soft);color:var(--pri)}
.ed-tools .tool3d{color:#fff}
.hl-y{background:#FFE98A!important}.hl-p{background:#FFC1D6!important}.hl-g{background:#B7EED8!important}

/* ---------- draw pad ---------- */
.pad{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.pad header,.pad footer{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card)}
.pad header{padding-top:calc(env(safe-area-inset-top) + 10px);box-shadow:var(--shadow2)}
.pad header b{flex:1;font-size:17px}
.pad footer{flex-direction:column;align-items:stretch;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -14px rgba(0,0,0,.3)}
.pad .prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pad .prow::-webkit-scrollbar{display:none}
.pad-stage{flex:1;position:relative;margin:12px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#FFFDF8}
.pad-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ptool{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--soft)}
.ptool.on{outline:3px solid var(--pri);outline-offset:-3px}
.pcol{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.pcol.on{box-shadow:0 0 0 3px var(--pri)}
.psize{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.psize i{display:block;border-radius:50%;background:var(--ink)}
.psize.on{outline:3px solid var(--pri);outline-offset:-3px}
.psep{width:1px;height:28px;background:var(--line);flex:none;margin:0 2px}
.ptog{flex:none;padding:0 12px;height:34px;border-radius:12px;background:var(--soft);font-size:12px;font-weight:800;white-space:nowrap}
.ptog.on{background:var(--pri);color:#fff}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(10,8,20,.94);display:flex;flex-direction:column}
.viewer .vimg{flex:1;overflow:auto;display:grid;place-items:center;padding:10px}
.viewer img{max-width:100%;max-height:100%;border-radius:12px;transition:transform .2s}
.viewer img.zoom{max-width:none;max-height:none;width:200%}
.viewer .vbar{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));justify-content:center}
.viewer .vbar button{padding:12px 18px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;display:flex;gap:8px;align-items:center}

/* ---------- lock ---------- */
.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(170deg,var(--bg) 40%,var(--n-lav));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px calc(30px + env(safe-area-inset-bottom));visibility:visible}
.lock .lk-ill{width:110px;height:110px;animation:float 4s ease-in-out infinite}
.lock h2{font-size:22px;font-weight:800;margin-top:14px}
.lock p{color:var(--muted);margin:6px 0 20px;text-align:center;font-size:14px}
.dots{display:flex;gap:12px;height:20px;margin-bottom:26px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.15s}
.dots i.f{background:var(--pri);transform:scale(1.15)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}

trOnline:['Bu cihazda yerleşik çeviri yok. Not metni çeviri için internet üzerinden MyMemory servisine gönderilecek (günlük ~5.000 karakter ücretsiz). Görseller, sesler ve çizimler gönderilmez.','No built-in translator on this device. The note text will be sent over the internet to the MyMemory service (about 5,000 free characters a day). Images, audio and ink are not sent.','Este dispositivo no tiene traductor. El texto se enviará al servicio MyMemory (unos 5.000 caracteres gratis al día). No se envían imágenes ni audio.','Pas de traducteur intégré. Le texte sera envoyé au service MyMemory (≈5 000 caractères gratuits/jour). Images et audio ne sont pas envoyés.','Nessun traduttore integrato. Il testo verrà inviato al servizio MyMemory (circa 5.000 caratteri gratis al giorno). Immagini e audio non vengono inviati.','Kein eingebauter Übersetzer. Der Text wird an den Dienst MyMemory gesendet (ca. 5.000 Zeichen/Tag gratis). Bilder und Audio nicht.','Sem tradutor integrado. O texto será enviado ao serviço MyMemory (cerca de 5.000 caracteres grátis por dia). Imagens e áudio não são enviados.','Встроенного переводчика нет. Текст будет отправлен в сервис MyMemory (≈5000 символов в день бесплатно). Фото и аудио не отправляются.','本设备没有内置翻译。笔记文字将通过网络发送到 MyMemory 服务（每天约 5000 字符免费），图片、音频和手写不会发送。','この端末には翻訳機能がありません。本文はインターネット経由で MyMemory に送信されます（1日約5,000文字まで無料）。画像・音声・手書きは送信されません。','لا يوجد مترجم مدمج. سيُرسل النص إلى خدمة MyMemory عبر الإنترنت (نحو 5000 حرف مجانًا يوميًا). لا تُرسل الصور أو الصوت.','इस डिवाइस में अनुवादक नहीं है। नोट का टेक्स्ट MyMemory सेवा को भेजा जाएगा (रोज़ ~5,000 अक्षर मुफ़्त)। छवियाँ और ऑडियो नहीं भेजे जाते।'],

const $ = (s, r = document) => r.querySelector(s);

const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => ymd(new Date());
const parseYmd = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const lower = s => String(s || '').toLocaleLowerCase(LOC());
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtDur = s => Math.floor(s / 60) + ':' + pad2(Math.floor(s % 60));
const U = 1000; // ink coordinate units across the page width

/* ---------- i18n ---------- */
let LI = 0;
const LOC = () => LANGS[LI][0];
function t(k, v) {
  const a = STR[k]; let s = a ? (a[LI] ?? a[1] ?? a[0]) : k;
  v = { app: APP, ...v };
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
}
function setLang(code, rerender = true) {
  LI = Math.max(0, LANGS.findIndex(l => l[0] === code));
  document.documentElement.lang = code;

  if (rerender) { buildTabbar(); render(); }
}
const dtf = o => new Intl.DateTimeFormat(LOC(), o);
const longDate = d => dtf({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d);
const monthYear = (y, m) => dtf({ month: 'long', year: 'numeric' }).format(new Date(y, m, 1));
const monthShort = d => dtf({ month: 'short' }).format(d);
const dayHead = d => dtf({ weekday: 'long', day: 'numeric', month: 'long' }).format(d);
const shortDate = d => dtf({ day: 'numeric', month: 'short', year: 'numeric' }).format(d);
const dateTime = d => dtf({ dateStyle: 'medium', timeStyle: 'short' }).format(d);
function relTime(ts) {
  const d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
  const rtf = new Intl.RelativeTimeFormat(LOC(), { numeric: 'auto' });
  if (diff < 60) return rtf.format(0, 'second');
  if (diff < 3600) return rtf.format(-Math.floor(diff / 60), 'minute');
  if (ymd(d) === ymd(now)) return dtf({ hour: '2-digit', minute: '2-digit' }).format(d);
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (ymd(d) === ymd(y)) return rtf.format(-1, 'day');
  return dtf(d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}
function greet() { const h = new Date().getHours(); return t(h < 6 ? 'gNight' : h < 12 ? 'gMorning' : h < 18 ? 'gDay' : 'gEvening'); }

const Crypt = {

  async dec(key, { iv, ct }) { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct))); }

const ALLOWED = new Set(['P','DIV','BR','B','STRONG','I','EM','U','S','STRIKE','H1','H2','H3','UL','OL','LI','BLOCKQUOTE','MARK','A','IMG','FIGURE','SPAN','HR','SMALL','CODE','PRE','FONT']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','svg','SVG','FORM','INPUT','TEXTAREA','BUTTON','SELECT','VIDEO','AUDIO','CANVAS']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const root = doc.body.firstElementChild;
  $$('*', root).forEach(el => {
    if (!el.isConnected) return;
    if (DROP.has(el.tagName)) { el.remove(); return; }
    if (!ALLOWED.has(el.tagName)) { el.replaceWith(...el.childNodes); return; }
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase(), v = a.value;
      if (['class', 'data-mid', 'data-dur', 'contenteditable', 'target', 'rel'].includes(n)) return;
      if (n === 'href' && /^(https?:|mailto:|tel:)/i.test(v.trim())) return;
      if (n === 'style' && /^(\s*(color|background-color|--c[12])\s*:\s*[#\w(),.\s%]+;?)+$/i.test(v)) return;
      if (n === 'color' && el.tagName === 'FONT') return;
      el.removeAttribute(a.name);
    });
    if (el.tagName === 'IMG' && !el.dataset.mid) el.remove();
    if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
  });
  return root.innerHTML;
}

function pinPad({ title, sub = '', lock = false, len = 0, cancellable = false, onSubmit }) {
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'lock';
    el.innerHTML = `<img class="lk-logo" src="${LOGO}" alt=""><h2>${esc(title)}</h2><p>${esc(sub)}</p><div class="dots"></div>
      <div class="pinpad">${['1','2','3','4','5','6','7','8','9','del','0','ok'].map(k =>
        `<button data-k="${k}" class="${k === 'ok' ? 'k-ok' : k === 'del' ? 'k-x' : ''}" aria-label="${k}">${k === 'ok' ? ic('check', 26, 3) : k === 'del' ? '⌫' : k}</button>`).join('')}</div>
      ${cancellable ? `<button class="cancel" data-k="x">${t('cancel')}</button>` : ''}
      ${lock ? '' : `<div class="warn">${t('pinWarn')}</div>`}`;
    document.body.appendChild(el);
    let pin = '', busyNow = false;
    const dots = $('.dots', el);
    const draw = () => { const n = Math.max(len || 4, pin.length); dots.innerHTML = Array.from({ length: Math.min(n, 8) }, (_, i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join(''); };
    const shake = () => { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); };
    draw();
    const finish = v => { el.remove(); removeEventListener('keydown', kd); resolve(v); };
    const submit = async () => {
      if (busyNow) return;
      if (pin.length < 4) return shake();
      busyNow = true; const ok = onSubmit ? await onSubmit(pin) : true; busyNow = false;
      if (ok) finish(pin); else { pin = ''; draw(); shake(); }
    };
    const press = k => {
      if (k === 'x') return finish(null);
      if (k === 'ok') return submit();
      if (k === 'del') { pin = pin.slice(0, -1); draw(); return; }
      if (pin.length >= 8) return;
      pin += k; draw();
      if (len && pin.length === len) setTimeout(submit, 120);
    };

async function runRecurring() {
  const tk = today();
  for (const r of S.txs.filter(x => x.repeat === 'monthly')) {
    const d0 = parseYmd(r.date); let y = d0.getFullYear(), m = d0.getMonth(); const day = d0.getDate();
    for (let k = 0; k < 240; k++) {
      m++; if (m > 11) { m = 0; y++; }
      const ds = `${y}-${pad2(m + 1)}-${pad2(Math.min(day, new Date(y, m + 1, 0).getDate()))}`;
      if (ds > tk) break;
      const mk = ds.slice(0, 7);
      if ((r.skips || []).includes(mk)) continue;
      if (S.txs.some(x => x.parentId === r.id && x.date.slice(0, 7) === mk)) continue;
      const c = { ...r, id: uid('t_'), parentId: r.id, repeat: null, date: ds, created: Date.now() }; delete c.skips;
      S.txs.push(c); await put('txs', c);

}

/* ---------- calculator ---------- */
function calc(expr) {
  const s = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
  const tk = s.match(/\d*\.?\d+|[-+*/]/g) || []; let i = 0;
  const num = () => { const x = tk[i++]; if (x === '-') return -num(); const v = parseFloat(x); return isNaN(v) ? 0 : v; };
  const term = () => { let v = num(); while (tk[i] === '*' || tk[i] === '/') { const op = tk[i++]; if (i >= tk.length) break; const r = num(); v = op === '*' ? v * r : (r === 0 ? v : v / r); } return v; };
  const ex = () => { let v = term(); while (tk[i] === '+' || tk[i] === '-') { const op = tk[i++]; if (i >= tk.length) break; const r = term(); v = op === '+' ? v + r : v - r; } return v; };
  return Math.round(ex() * 100) / 100;
}

      $('#ae', el).textContent = /[÷×−+]/.test(expr.replace(/^−/, '')) ? show(expr) + ' =' : '';
      $('#av', el).innerHTML = `<span class="${x.type === 'in' ? 'pos' : 'neg'}">${money(calc(expr))}</span>`;
    };
    upd();
    $('#tt', el).onclick = e => { const b = e.target.closest('[data-v]'); if (b) { x.type = b.dataset.v; upd(); } };
    $('#tm', el).onclick = e => { const b = e.target.closest('[data-v]'); if (b) { x.method = b.dataset.v; upd(); } };
    $('#cg', el).onclick = e => { const b = e.target.closest('[data-c]'); if (b) { x.cat = b.dataset.c; upd(); } };
    $('#kp', el).onclick = e => {
      const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
      if (k === '⌫') expr = expr.slice(0, -1);
      else if (/[÷×−+]/.test(k)) { if (!expr) return; expr = /[÷×−+]$/.test(expr) ? expr.slice(0, -1) + k : expr + k; }
      else if (k === ',') { const seg = expr.split(/[÷×−+]/).pop(); if (seg.includes(',')) return; expr += seg ? ',' : '0,'; }
      else { const seg = expr.split(/[÷×−+]/).pop(); if (seg === '0') expr = expr.slice(0, -1); if (seg.split(',')[1]?.length >= 2) return; if (expr.length > 40) return; expr += k; }
      upd();
    };

      if (isNew && S.view === 'finance') { const d = parseYmd(x.date); S.month = [d.getFullYear(), d.getMonth()]; }

      if (x.parentId) { const r = S.txs.find(z => z.id === x.parentId); if (r) { r.skips = [...(r.skips || []), x.date.slice(0, 7)]; await put('txs', r); } }

    });
  } });
}

function highlight(text, q) {
  const s = String(text), L = lower(s), Q = lower(q); if (!Q) return esc(s);
  let out = '', i = 0, p;
  while ((p = L.indexOf(Q, i)) >= 0) { out += esc(s.slice(i, p)) + '<mark>' + esc(s.slice(p, p + Q.length)) + '</mark>'; i = p + Q.length; }
  return out + esc(s.slice(i));
}
function searchResults() {

  notes.sort((a, b) => b.updated - a.updated); txs.sort((a, b) => b.date.localeCompare(a.date));

  return `${notes.length ? `<div class="sh-sub">${t('tNotes')} · ${notes.length}</div><div class="notes list">${notes.slice(0, 50).map(n => noteCard(n, hl)).join('')}</div>` : ''}

  if (!p1) { render(); return; }

  if (!p2) { render(); return; }
  const done = busy(t('encrypting'));

}

  });
}

    const tc = google.accounts.oauth2.initTokenClient({
      client_id: gcalId(), scope: 'https://www.googleapis.com/auth/calendar.events', prompt: S.ui.gcalConsented ? '' : 'consent',
      callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); GTOKEN = { token: r.access_token, exp: Date.now() + (r.expires_in || 3600) * 1000 }; S.ui.gcalConsented = true; saveUi(); res(GTOKEN.token); },
      error_callback: e => rej(new Error(e?.type || 'popup'))
    });
    S.picking = true; setTimeout(() => S.picking = false, 6000);
    tc.requestAccessToken();
  });
}
async function gapi(method, path, body, tk) {
  const r = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events' + path, { method, headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { GTOKEN = null; throw new Error('Google: 401'); }
  if (r.status === 404 || r.status === 410 || r.status === 204) return null;
  if (!r.ok) throw new Error('Google: HTTP ' + r.status);
  return r.json().catch(() => null);
}
function gEvent(n) {
  const r = n.remind, tz = Intl.DateTimeFormat().resolvedOptions().timeZone, lock = S.sec?.enabled;
  const rr = { daily: 'RRULE:FREQ=DAILY', weekly: 'RRULE:FREQ=WEEKLY', monthly: 'RRULE:FREQ=MONTHLY' }[r.repeat];
  return { summary: '⏰ ' + (lock ? APP : (n.title || t('untitled'))), description: (lock ? t('lockedBody') : noteInfo(n).text.slice(0, 800)) + '\n\n— ' + APP,
    start: { dateTime: new Date(r.at).toISOString(), timeZone: tz }, end: { dateTime: new Date(r.at + 15 * 60000).toISOString(), timeZone: tz },
    reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 0 }] }, ...(rr ? { recurrence: [rr] } : {}),
    extendedProperties: { private: { kalemdarId: n.id } } };
}
async function gcalPush(n, interactive) {
  if (!S.ui.gcal || !gcalId() || !activeRemind(n)) return false;
  const tk = await gToken(interactive); if (!tk) return false;
  let ev = n.remind.gId ? await gapi('PUT', '/' + encodeURIComponent(n.remind.gId), gEvent(n), tk) : null;
  if (!ev?.id) ev = await gapi('POST', '', gEvent(n), tk);
  n.remind.gId = ev.id; n.remind.gAt = n.remind.at; await put('notes', n);
  return true;
}
async function gcalDelete(gId, interactive) {
  if (!gId) return;
  const tk = S.ui.gcal ? await gToken(interactive).catch(() => null) : null;
  if (!tk) { S.ui.gPendingDel = [...(S.ui.gPendingDel || []), gId]; await saveUi(); return; }
  await gapi('DELETE', '/' + encodeURIComponent(gId), null, tk);
}
async function gcalSyncAll(interactive) {
  const tk = await gToken(interactive); if (!tk) return 0;
  for (const id of S.ui.gPendingDel || []) { try { await gapi('DELETE', '/' + encodeURIComponent(id), null, tk); } catch {} }
  S.ui.gPendingDel = []; await saveUi();
  let c = 0;
  for (const n of S.notes.filter(activeRemind)) { if (!n.remind.gId || ((n.remind.repeat || 'none') === 'none' && n.remind.gAt !== n.remind.at)) await gcalPush(n, false); c++; }
  return c;
}
async function toggleGcal() {
  if (S.ui.gcal) {
    S.ui.gcal = false; try { if (GTOKEN) google.accounts.oauth2.revoke(GTOKEN.token); } catch {} GTOKEN = null; await saveUi(); toast(t('gcalOff')); render(); return;
  }
  if (!gcalId()) { render(); return; }
  need('gis').catch(() => {});
  if (!await ask('📅 ' + t('gcalSync'), t('gcalConsent'), t('gcalConnect'))) { render(); return; }
  try {
    S.ui.gcal = true; await saveUi();
    await gToken(true); toast(t('gcalOn'));
    const c = await gcalSyncAll(false); if (c) toast(t('gcalSynced', { n: c }));
  } catch (err) { S.ui.gcal = false; await saveUi(); toast(t('failed', { e: err.message })); }
  render();
}
function exportAllIcs() {
  const list = S.notes.filter(activeRemind);
  if (!list.length) { toast(t('nothingExport')); return; }
  const evs = list.map(n => icsFor(n).split('\r\n').filter(l => !/^(BEGIN:VCALENDAR|VERSION|PRODID|CALSCALE|END:VCALENDAR)/.test(l)).join('\r\n'));
  download(`kalemdar-${t('cRemind').replace(/[^\p{L}]/gu, '').toLowerCase() || 'reminders'}.ics`, ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${APP}//EN`, 'CALSCALE:GREGORIAN', ...evs, 'END:VCALENDAR'].join('\r\n'), 'text/calendar;charset=utf-8');
  toast(t('downloaded'));
}

/* ---------- viewport (keyboard) ---------- */
if (window.visualViewport) {
  const vv = () => document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px');
  visualViewport.addEventListener('resize', vv); vv();
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claudeusercontent|claude\.ai/.test(location.host)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.__kalemdar = { S, t, buildXlsx, buildDocx, noteBlocks, get ED() { return ED; } };
boot();
})();
